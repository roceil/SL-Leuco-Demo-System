<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leuco Sapphire - 登入</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft JhengHei', 'PingFang TC', 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1e5a9e 0%, #2d7ab8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 48px 40px;
            width: 100%;
            max-width: 440px;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo img {
            max-width: 200px;
            height: auto;
        }

        .logo-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #1976d2;
            font-size: 28px;
            font-weight: bold;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .ship {
            font-size: 32px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            color: #424242;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #9e9e9e;
            font-size: 18px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 14px 16px 14px 48px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #2196f3;
            box-shadow: 0 0 0 3px rgba(33, 150, 243, 0.1);
        }

        input[type="text"]::placeholder,
        input[type="password"]::placeholder {
            color: #bdbdbd;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 24px;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 8px;
            cursor: pointer;
            accent-color: #2196f3;
        }

        .checkbox-label {
            color: #616161;
            font-size: 14px;
            cursor: pointer;
            user-select: none;
        }

        .login-button {
            width: 100%;
            padding: 16px;
            background: #2196f3;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(33, 150, 243, 0.3);
        }

        .login-button:hover {
            background: #1976d2;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(33, 150, 243, 0.4);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .login-button:focus {
            outline: 2px solid #2196f3;
            outline-offset: 2px;
        }

        .error-message {
            color: #f44336;
            font-size: 13px;
            margin-top: 6px;
            display: none;
        }

        input.error {
            border-color: #f44336;
        }

        input.error:focus {
            box-shadow: 0 0 0 3px rgba(244, 67, 54, 0.1);
        }

        /* 響應式設計 */
        @media (max-width: 480px) {
            .login-container {
                padding: 32px 24px;
            }

            .logo-placeholder {
                font-size: 24px;
            }

            .ship {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <!-- 實際使用時替換為真實 logo -->
            <div class="logo-placeholder">
                <div class="logo-icon">
                    <span class="ship">🚢</span>
                    <span class="ship">⚓</span>
                </div>
                <div>
                    <div style="font-size: 24px;">藍白航運</div>
                    <div style="font-size: 14px; color: #666; font-weight: normal;">LEUCO SAPPHIRE SHIPPING</div>
                </div>
            </div>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">帳號</label>
                <div class="input-wrapper">
                    <span class="input-icon">👤</span>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="請輸入帳號"
                        required
                    >
                </div>
                <div class="error-message" id="usernameError">請輸入有效的帳號</div>
            </div>

            <div class="form-group">
                <label for="password">密碼</label>
                <div class="input-wrapper">
                    <span class="input-icon">🔒</span>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="請輸入密碼"
                        required
                    >
                </div>
                <div class="error-message" id="passwordError">請輸入密碼</div>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="remember" name="remember">
                <label for="remember" class="checkbox-label">記住我</label>
            </div>

            <button type="submit" class="login-button">登入</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const usernameError = document.getElementById('usernameError');
        const passwordError = document.getElementById('passwordError');

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            let isValid = true;

            // 重置錯誤狀態
            usernameInput.classList.remove('error');
            passwordInput.classList.remove('error');
            usernameError.style.display = 'none';
            passwordError.style.display = 'none';

            // 驗證帳號
            if (usernameInput.value.trim() === '') {
                usernameInput.classList.add('error');
                usernameError.style.display = 'block';
                isValid = false;
            }

            // 驗證密碼
            if (passwordInput.value.trim() === '') {
                passwordInput.classList.add('error');
                passwordError.style.display = 'block';
                isValid = false;
            }

            if (isValid) {
                // 實際應用中，這裡應該發送登入請求
                alert('登入成功！');
                window.location.href = 'dashboard.html';
            }
        });

        // 輸入時移除錯誤狀態
        usernameInput.addEventListener('input', function() {
            if (this.classList.contains('error')) {
                this.classList.remove('error');
                usernameError.style.display = 'none';
            }
        });

        passwordInput.addEventListener('input', function() {
            if (this.classList.contains('error')) {
                this.classList.remove('error');
                passwordError.style.display = 'none';
            }
        });
    </script>
</body>
</html>
